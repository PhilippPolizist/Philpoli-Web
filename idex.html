<!DOCTYPE html>
<html lang="de">

    
    <head>
        <title>Sperrseite - Philpoli-Network</title>
        <link rel="stylesheet" href="style.css">
    </head>
    
    <body>
        <div class="layout-container">
            <aside class="sidebar">
                <!-- 1. Die Überschrift -->
                <h2 class="sidebar-title">Philpoli-Network</h2>
                <h2 class="sidebar-title">Sperrbildschirm</h2>

                <!-- 2. Der Kasten für die drei Elemente -->
                <div class="sidebar-box">
                    <h1>🔒 Server-Zugang</h1>
                    <p>Bitte gib das Passwort ein, um die Serverdaten zu sehen.</p>
                    <input type="password" id="passwordInput" placeholder="Passwort eingeben..." onkeypress="handleKeyPress(event)">
                    <br>
                    <button onclick="checkPassword()">Verbinden</button>
                    <div id="errorMessage" class="error">Falsches Passwort! Versuche es nochmal.</div>
                </div>

                <!-- 3. Der zentrierte Text ganz unten -->
                <div class="sidebar-footer">
                    Website für geladene Freunde
                </div>
            </aside>
        </div>
        <script>
            // Der SHA-256 Hash für das Passwort "craft25"
            const targetHash = "cb583589d42ffe99b37cf89be8858ef45dc887b1e29f945935210b560dadfa87"; 

            // Hilfsfunktion zur Hash-Berechnung im Browser (ohne externe Skripte)
            async function sha256(message) {
                const msgBuffer = new TextEncoder().encode(message);                    
                const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
                const hashArray = Array.from(new Uint8Array(hashBuffer));
                return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            }

            async function checkPassword() {
                const input = document.getElementById("passwordInput").value;
                const inputHash = await sha256(input);

                if (inputHash === targetHash) {
                    // Richtiges Passwort: Sperre weg, Inhalt zeigen
                    window.location.href = "home.html";
                } else {
                    // Falsches Passwort: Fehlermeldung einblenden
                    document.getElementById("errorMessage").style.display = "block";
                    document.getElementById("passwordInput").value = "";
                }
            }

            // Erlaubt das Abschicken mit der Enter-Taste
            function handleKeyPress(event) {
                if (event.key === "Enter") {
                checkPassword();
                }
            }
        </script>
    </body>






</html>
