<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Server Status</title>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 400px;
            width: 90%;
            border: 1px solid #333;
        }
        h1 { color: #4caf50; margin-bottom: 20px; font-size: 24px; }

        .status-box { background: #252525; padding: 15px; border-radius: 6px; margin-top: 15px; text-align: left; }
        .online { color: #4caf50; font-weight: bold; }
    </style>
</head>
<body>
    <div id="content" class="container">
        <h1>🎮 Unser Minecraft Server</h1>
        <div class="status-box">
            <p><strong>IP-Adresse:</strong> <code>meinserver.minekeep.net</code></p>
            <p><strong>Status:</strong> <span class="online">● Online</span></p>
            <p><strong>Spieler:</strong> 0 / 25</p>
        </div>
        <p style="font-size: 12px; color: #777; margin-top: 20px;">Rein privates Angebot für Freunde.</p>
        <br>
        <a href="index.html">Zurück zum Sperrbildschirm</a>
    </div>
</body>
