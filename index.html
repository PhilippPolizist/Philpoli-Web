<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Server Status</title>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 400px;
            width: 90%;
            border: 1px solid #333;
        }
        h1 { color: #4caf50; margin-bottom: 20px; font-size: 24px; }
        input[type="password"] {
            width: 80%;
            padding: 12px;
            border: 2px solid #444;
            border-radius: 6px;
            background: #2a2a2a;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }
        input[type="password"]:focus { border-color: #4caf50; }
        button {
            margin-top: 15px;
            padding: 12px 24px;
            background: #4caf50;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        button:hover { background: #45a049; }
        .error { color: #ff5252; margin-top: 15px; font-size: 14px; display: none; }
        
        /* Dieser Bereich ist am Anfang unsichtbar */
        #content { display: none; }
        .status-box { background: #252525; padding: 15px; border-radius: 6px; margin-top: 15px; text-align: left; }
        .online { color: #4caf50; font-weight: bold; }
    </style>
</head>
<body>

    <!-- 1. DIE SPERRSEITE -->
    <div id="lockscreen" class="container">
        <h1>🔒 Server-Zugang</h1>
        <p>Bitte gib das Passwort ein, um die Serverdaten zu sehen.</p>
        <input type="password" id="passwordInput" placeholder="Passwort eingeben..." onkeypress="handleKeyPress(event)">
        <br>
        <button onclick="checkPassword()">Verbinden</button>
        <div id="errorMessage" class="error">Falsches Passwort! Versuche es nochmal.</div>
    </div>

    <!-- 2. INHALT (Wird erst nach Passworteingabe sichtbar) -->
    <div id="content" class="container">
        <h1>🎮 Unser Minecraft Server</h1>
        <div class="status-box">
            <p><strong>IP-Adresse:</strong> <code>meinserver.minekeep.net</code></p>
            <p><strong>Status:</strong> <span class="online">● Online</span></p>
            <p><strong>Spieler:</strong> 0 / 25</p>
        </div>
        <p style="font-size: 12px; color: #777; margin-top: 20px;">Rein privates Angebot für Freunde.</p>
    </div>

    <script>
        // Der SHA-256 Hash für das Passwort "craft25"
        const targetHash = "cb583589d42ffe99b37cf89be8858ef45dc887b1e29f945935210b560dadfa87"; 

        // Hilfsfunktion zur Hash-Berechnung im Browser (ohne externe Skripte)
        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);                    
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function checkPassword() {
            const input = document.getElementById("passwordInput").value;
            const inputHash = await sha256(input);

            if (inputHash === targetHash) {
                // Richtiges Passwort: Sperre weg, Inhalt zeigen
                document.getElementById("lockscreen").style.display = "none";
                document.getElementById("content").style.display = "block";
            } else {
                // Falsches Passwort: Fehlermeldung einblenden
                document.getElementById("errorMessage").style.display = "block";
                document.getElementById("passwordInput").value = "";
            }
        }

        // Erlaubt das Abschicken mit der Enter-Taste
        function handleKeyPress(event) {
            if (event.key === "Enter") {
                checkPassword();
            }
        }
    </script>
</body>
</html>
