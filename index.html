<!DOCTYPE html>
<html>
    <head>
        <title>Philpoli-Network</title>
        <link rel="icon" href="photos/logo.png" type="image/png">
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://cloudflare.com">
    </head>
    <body>
        <main class="screen-wrapper">

            <section class="seitenleiste">

                <div class="ue-box">
                    <img src="photos/logo.png" alt="Philpoli-Network - Logo">

                    <div class="schrift-box">
                        <h1 class="border"><span class="phil">Phil</span><span class="poli">poli</span>-<span class="net">Network</span></h1>
                        <div class="trenner"></div>
                        <h1>Sperrbildschirm</h1>
                    </div>
                </div>

                <div class="login-box">
                    <h2><u>Passworteingabe:</u></h2>
                    <br>
                    <p>Bitte gebe ein Passwort ein:</p>
                    <input type="password" id="passwordInput" placeholder="Passwort eingeben..." onkeypress="handleKeyPress(event)">
                    <button onclick="checkPassword()">Verbinden</button>
                    <br><br>
                    <div id="errorMessage" class="error">Falsches Passwort! Versuche es nochmal.</div>
                    <img src="photos/panda.png" alt="Panda" id="panda">
                </div>

                <p class="sidebar-text">geschützte, private Website von Philpoli</p>

                <div class="footer-box">
                    <div class="link-box">
                        <a href="https://discord.gg/bvzXYQc7JN" target="_blank">Unser Discord-Server:</a>
                        <img src="photos/Discord.png" alt="Discord-Logo">
                    </div>
                    <div class="link-box git-box">
                        <a href="https://github.com/PhilippPolizist" target="_blank">Mein GitHub-Account:</a>
                        <img src="photos/GitHub.png" alt="GitHub-Logo">
                    </div>
                </div>

            </section>

            <section class="hintergund">
                <img src="photos/Hintergund.png" alt="Bannerbild">
            </section>

        </main>
        <script>
            // Der SHA-256 Hash für das Passwort "craft25"
            const targetHash = "cb583589d42ffe99b37cf89be8858ef45dc887b1e29f945935210b560dadfa87"; 

            // Hilfsfunktion zur Hash-Berechnung im Browser (ohne externe Skripte)
            async function sha256(message) {
                const msgBuffer     = new TextEncoder().encode(message);                    
                const hashBuffer    = await crypto.subtle.digest('SHA-256', msgBuffer);
                const hashArray     = Array.from(new Uint8Array(hashBuffer));
                return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            }

            async function checkPassword() {
                const input         = document.getElementById("passwordInput").value;
                const panda         = document.getElementById("panda");
                const errorMessage  = document.getElementById("errorMessage")

                const inputHash  = await sha256(input);

                if (inputHash === targetHash) {
                    // Richtiges Passwort: Sperre weg, Inhalt zeigen
                    window.location.href = "home.html";
                } else {
                    // Falsches Passwort: Fehlermeldung einblenden
                    document.getElementById("errorMessage").style.display = "block";
                    document.getElementById("passwordInput").value = "";
                    
                    errorMessage.style.display = "block";
                    panda.src = "photos/panda-erschrocken.png";
                    // nach 3 Sekunden wieder einschlafen
                    setTimeout(() => {
                        errorMessage.style.display = "none";
                        panda.src = "photos/panda.png";
                    }, 3000);
                }
            }

            // Erlaubt das Abschicken mit der Enter-Taste
            function handleKeyPress(event) {
                if (event.key === "Enter") {
                checkPassword();
                }
            }
        </script>
    </body>
</html>
